server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/umucraft/www;

    location /maps/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Painel admin (status do watcher, manifest, rebuild manual) — nunca
    # exposto sem senha. O app Flask/waitress escuta so em 127.0.0.1:8787.
    location /admin/ {
        auth_basic "UmuCraft Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-umucraft-admin;
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    client_max_body_size 0;
}
