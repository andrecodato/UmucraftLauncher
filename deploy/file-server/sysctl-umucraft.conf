# Bump inotify limits for the umucraft-watcher service.
#
# Default max_queued_events (16384) can overflow when a modpack update
# (hundreds of mods + shaderpacks/resourcepacks/config) lands via Samba in
# one burst: the kernel drops events past the queue limit, and `watchdog`
# reacts to that overflow by doing a full recursive re-walk of the watched
# tree, re-emitting a synthetic change event for every existing file even
# though nothing actually changed. Symptom: the watcher log floods with
# "mudanca detectada" for files whose real mtime never moved, in bursts
# that don't correspond to anything the pack owner just did.
#
# max_user_watches (default 8192) is one watch per *directory*, not per
# file — comfortably covers two profiles' config/shaderpacks/resourcepacks
# trees, but has little headroom left for more profiles or deeper mod
# config layouts, so it gets a matching bump.
#
# On Proxmox LXC, apply this file on the HOST node if `sysctl --system`
# inside the container is a no-op / fails — the guest inherits the host
# inotify limits.
fs.inotify.max_queued_events = 131072
fs.inotify.max_user_watches = 65536
fs.inotify.max_user_instances = 256
