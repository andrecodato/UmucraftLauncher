name: Release launcher

# Dispara ao dar push numa tag "vX.Y.Z". O file-server
# (deploy/file-server/pull-launcher-release.py) fica de olho na release mais
# recente deste repo e publica sozinho em umucraft-updates.codato.dev/launcher/
# — nao ha deploy nenhum aqui, so build + release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verifica se a tag bate com package.json
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag v$tagVersion nao bate com version do package.json ($pkgVersion). Bump o package.json e crie a tag de novo."
            exit 1
          }

      - run: npm ci

      - run: npm run build

      # generate_release_notes do GitHub só lista PRs — como este repo mergeia
      # localmente (git merge) e dá push direto em main sem abrir PR, ele não
      # tem nada pra listar e a release fica só com o link de comparação, sem
      # descrição nenhuma (confirmado na v1.0.1). Gera o changelog a partir
      # dos commits de verdade (--no-merges, sem os "Bump version" também).
      - name: Gera changelog a partir dos commits
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          fi

          LOG=$(git log --no-merges --pretty=format:"- %s" "$RANGE" | grep -v "^- Bump version" || true)
          if [ -z "$LOG" ]; then
            LOG="- Sem mudanças descritas nos commits deste range."
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Publica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ${{ steps.changelog.outputs.prev_tag && format('**Full Changelog**: https://github.com/{0}/compare/{1}...{2}', github.repository, steps.changelog.outputs.prev_tag, github.ref_name) || '' }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:linux

      - name: Publica assets Linux na Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
