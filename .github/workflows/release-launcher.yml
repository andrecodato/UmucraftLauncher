name: Release launcher

# Dispara ao dar push numa tag "vX.Y.Z". O Pi (deploy/pi-server/pull-launcher-release.py)
# fica de olho na release mais recente deste repo e publica sozinho em
# umucraft-updates.codato.dev/launcher/ — nao ha deploy nenhum aqui, so build + release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verifica se a tag bate com package.json
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag v$tagVersion nao bate com version do package.json ($pkgVersion). Bump o package.json e crie a tag de novo."
            exit 1
          }

      - run: npm ci

      - run: npm run build

      - name: Publica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
